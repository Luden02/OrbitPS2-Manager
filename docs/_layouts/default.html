<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    (function () {
      var stored = localStorage.getItem("orbitps2-docs-theme");
      if (stored === "light" || stored === "dark") {
        document.documentElement.dataset.theme = stored;
      }
    })();
  </script>
</head>
<body>
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation">☰</button>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a class="sidebar-brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/icon.svg' | relative_url }}" alt="" width="32" height="32">
        <span>OrbitPS2</span>
      </a>

      <p class="nav-label">Documentation</p>
      <ul class="sidebar-nav">
        {% for item in site.nav %}
        {% assign item_url = item.url | relative_url %}
        <li>
          <a href="{{ item_url }}" class="{% if page.url == item.url %}active{% endif %}">{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>

      <div class="sidebar-footer">
        <button id="theme-toggle" class="theme-toggle" type="button">🌙 Dark mode</button>
        <a href="https://github.com/Luden02/OrbitPS2-Manager" target="_blank" rel="noopener">GitHub Repository ↗</a>
        <a href="https://github.com/Luden02/OrbitPS2-Manager/releases" target="_blank" rel="noopener">Latest Release ↗</a>
      </div>
    </aside>

    <main class="content">
      {{ content }}
    </main>
  </div>

  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
